name: Deploy web clock to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'quote_to_image/litclock_annotated.yaml'
      - 'quote_to_image/common.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.2
      - run: python web/build_web.py
      # a new cache name per commit makes devices replace their offline copy
      - run: sed -i "s/var CACHE = 'litclock-v1'/var CACHE = 'litclock-${GITHUB_SHA::8}'/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
